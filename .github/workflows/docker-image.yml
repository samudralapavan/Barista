name: Build and Push Docker Image

on:
  push:
    branches:
      - pavans  # You can change this to your desired branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      # uses: docker/build-push-action@v6
      # with:
      #   username: ${{ secrets.DOCKER_USERNAME }}
      #   password: ${{ secrets.DOCKER_PASSWORD }}
      # - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


    # Build the Docker image
    - name: Build Docker image
      run: docker build . -t ${{ secrets.DOCKER_USERNAME }}/github:latest

    # Push the Docker image to Docker Hub
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/github:latest

    # - name: Load Docker image on remote server via SSH
    #   uses: appleboy/ssh-action@v0.1.3
    #   with:
    #     host: ${{ secrets.REMOTE_HOST }}
    #     username: ${{ secrets.REMOTE_USER }}
    #     port: ${{ secrets.REMOTE_PORT }}
    #     key: ${{ secrets.SSH_PRIVATE_KEY }}
    #     script: |
    #       docker pull pavansamu/github:latest
    #       docker run -d --name barista -p 80:80 pavansamu/github:latest
    - name: Debug SSH Connection
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        script: |
          ssh -v root@${{ secrets.REMOTE_HOST }}

