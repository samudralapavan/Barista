name: Build and Push Docker Image

on:
  push:
    branches:
      - pavans  # You can change this to your desired branch
  pull_request:
     branches: ["pavans"]

jobs:
  build_push_image:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

     # Build the Docker image
    - name: Build Docker image
      run: docker build . -t ${{ secrets.DOCKER_USERNAME }}/github_actions:V1
      # Log in to Docker Hub
    - name: Log in to Docker Hub
      # uses: docker/build-push-action@v6
      # with:
      #   username: ${{ secrets.DOCKER_USERNAME }}
      #   password: ${{ secrets.DOCKER_PASSWORD }}
      # - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      # Push the Docker image to Docker Hub
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/github_actions:latest

  Final_job:
    needs: build_push_image
    runs-on: ubuntu-latest

    steps:
      - name: Final steps

        run:
          echo "The job successfully comppleted and pushed into docker hub with specific repo."
    
  
